<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNJEX Sim</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <aside class="panel" aria-label="Arm controls">
    <h1>PNJEX V6</h1>
    <div id="sliders"></div>
    <div class="buttons">
      <button id="home-pose" type="button">Home pose</button>
      <button id="park-pose" type="button">Park arm</button>
      <button id="reset-view" type="button">Reset view</button>
      <button id="open-camera" type="button">Camera tab</button>
    </div>
    <h2>Pick and place</h2>
    <div class="buttons">
      <button id="scatter" type="button">Scatter cubes</button>
      <button id="pick" type="button">Pick random cube</button>
    </div>
    <h2>Brain control (recorded EEG)</h2>
    <div class="buttons">
      <button id="pick-eeg" type="button" class="wide">Pick with Nav’s EEG</button>
    </div>
    <canvas id="eeg-trace" class="eeg-trace" height="44" hidden></canvas>
    <p id="eeg-stats" class="task-status"></p>
    <p id="task-status" class="task-status" role="status"></p>
    <label class="check"><input id="show-reach" type="checkbox"> Show reach band</label>
    <p class="hint">Drag to orbit. Scroll to zoom. Right-drag to pan.</p>
  </aside>

  <div id="camera-view"><span>Table camera</span></div>

  <div id="loading" role="status"><span id="loading-text">Loading arm</span></div>
  <script type="module" src="main.js"></script>
</body>
</html>
