<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reach Sim</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <aside class="panel" aria-label="Controls">
    <h1>Reach</h1>
    <div class="buttons">
      <button id="pick-gaze" type="button" class="wide primary" data-keep>Pick with eyes + clench</button>
      <button id="scatter" type="button">Scatter cubes</button>
      <button id="open-camera" type="button">Camera tab</button>
    </div>
    <p class="hint-small">Look at a cube in the Camera tab (it turns yellow) and clench your jaw to pick it. Esc stops.</p>
    <p id="camera-line" class="task-status">Camera tab: not open</p>
    <p id="task-status" class="task-status" role="status"></p>

    <h2>Headset</h2>
    <p id="headset-status" class="task-status">Looking for the headset…</p>
    <div id="imp-rows" class="imp-rows" hidden></div>
    <div class="buttons">
      <button id="imp-check" type="button" class="wide">Check electrodes (impedance)</button>
    </div>

    <h2>Arm</h2>
    <div id="sliders" class="arm-sliders"></div>
    <div class="buttons">
      <button id="home-pose" type="button">Home pose</button>
      <button id="park-pose" type="button">Park arm</button>
      <button id="reset-view" type="button" class="wide">Reset view</button>
    </div>
    <p class="hint">Drag to orbit. Scroll to zoom. Right-drag to pan.</p>
  </aside>

  <div id="camera-view"><span>Table camera</span></div>

  <div id="loading" role="status"><span id="loading-text">Loading arm</span></div>
  <script type="module" src="main.js"></script>
</body>
</html>
