<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNJEX Table Camera</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body class="camera-page">
  <div id="viewport"></div>
  <div class="camera-toolbar">
    <button id="detect" type="button" disabled>Detect objects</button>
    <button id="flicker" type="button" aria-pressed="false" disabled>Start flicker</button>
    <button id="clear" type="button" disabled>Clear</button>
    <span class="warning">Flicker shows flashing lights</span>
    <span id="detect-status" role="status"></span>
  </div>
  <p id="status" class="camera-status">Showing the home pose. Open the sim tab to move the arm.</p>
  <div id="loading" role="status"><span id="loading-text">Loading arm</span></div>
  <script type="module" src="camera-view.js"></script>
</body>
</html>
