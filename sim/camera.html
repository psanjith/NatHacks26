<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNJEX Table Camera</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body class="camera-page">
  <div id="viewport"></div>
  <p id="status" class="camera-status">Open the sim tab to move the arm.</p>
  <p id="prompt" class="gaze-prompt" role="status" hidden></p>

  <section class="dock" aria-label="Headset and eye tracker">
    <canvas id="waves" class="waves" aria-label="Live EEG, four channels"></canvas>
    <div class="dock-side">
      <div id="webcam" class="webcam" hidden></div>
      <label class="person">Person <input id="person" type="text" spellcheck="false" autocomplete="off"></label>
      <p id="eyes-status" class="eyes-line">Eyes: starting…</p>
      <div class="jaw-meter" aria-hidden="true"><div id="jaw-fill"></div><div id="jaw-mark" hidden></div></div>
      <p id="jaw-status" class="eyes-line">Jaw: looking for the headset…</p>
      <div class="buttons">
        <button id="recalibrate" type="button">New eye profile</button>
        <button id="clench-check" type="button">Clench check</button>
      </div>
      <p class="hint">Space = clench · Esc = stop · R = re-centre · D = gaze cursor · G = glances/webcam · K = eye check · +/− clench sensitivity</p>
    </div>
  </section>
  <div id="gaze-dot" class="gaze-dot" data-on="1" hidden></div>
  <canvas id="gaze-layer" class="gaze-layer" hidden></canvas>

  <div id="loading" role="status"><span id="loading-text">Loading arm</span></div>
  <script type="module" src="camera-view.js"></script>
</body>
</html>
